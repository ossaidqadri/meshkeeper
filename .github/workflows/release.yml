name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The daemon's own tests. Same pinned Zig as the package build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          curl -fsSLO https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig-x86_64-linux-0.17.0.tar.xz" | sha256sum -c -
          tar -xf zig-x86_64-linux-0.17.0.tar.xz
          echo "${{ github.workspace }}/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - run: zig fmt --check src build.zig
      - run: zig build test

  package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every arch on a tag; the real router plus the smoke-test arch otherwise.
      matrix:
        include: >-
          ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[
            {"name":"mips_24kc","target":"ath79/generic"},
            {"name":"mipsel_24kc","target":"ramips/mt7621"},
            {"name":"arm_cortex-a7_neon-vfpv4","target":"ipq40xx/generic"},
            {"name":"aarch64_cortex-a53","target":"mediatek/filogic"},
            {"name":"x86_64","target":"x86/64"}]' || '[
            {"name":"mips_24kc","target":"ath79/generic"},
            {"name":"x86_64","target":"x86/64"}]') }}
    steps:
      - uses: actions/checkout@v7

      # The SDK's prerequisite check refuses to run without these.
      - name: SDK host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential gawk gettext libncurses-dev libssl-dev zlib1g-dev xz-utils \
            wget file zstd rsync unzip bzip2 python3 python3-setuptools swig

      - name: Fetch SDK
        env:
          TARGET: ${{ matrix.target }}
        run: |
          base="https://downloads.openwrt.org/releases/25.12.6/targets/$TARGET"
          curl -fsSL -o sums "$base/sha256sums"
          # Name and checksum both come from the release: ipq40xx is published
          # as _musl_eabi, so the filename cannot be assembled by hand.
          grep 'openwrt-sdk-.*\.tar\.zst$' sums > sdk.sum
          file=$(awk '{print $2}' sdk.sum); file=${file#\*}
          curl -fsSL -o "$file" "$base/$file"
          sha256sum -c sdk.sum
          mkdir sdk
          tar --zstd -xf "$file" -C sdk --strip-components=1

      - name: Build packages
        run: |
          mkdir -p sdk/package/meshkeeper
          cp -r Makefile files src build.zig build.zig.zon LICENSE sdk/package/meshkeeper/
          cd sdk
          make defconfig
          # One package directory, so one target builds both packages.
          make package/meshkeeper/compile V=s

      - name: Collect
        env:
          ARCH: ${{ matrix.name }}
        run: |
          mkdir -p out
          find sdk/bin/packages \( -name 'meshkeeper-*.apk' -o -name 'luci-app-meshkeeper-*.apk' \) |
          while read -r f; do
            name=$(basename "$f" .apk)
            # The LuCI page is architecture independent: one leg ships it, unsuffixed.
            case "$name" in
              luci-app-*) if [ "$ARCH" = x86_64 ]; then cp "$f" "out/$name.apk"; fi ;;
              *) cp "$f" "out/$name-$ARCH.apk" ;;
            esac
          done
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: meshkeeper-${{ matrix.name }}
          path: out/*.apk
          if-no-files-found: error

      # The bench's upgrade tests need the same package as release 2, with a different binary.
      # The SDK is already built here, so rebuild in place; no second SDK anywhere. Uploaded
      # under another name so the release job, which takes only meshkeeper-*, never ships it.
      - name: Build release 2 for the bench
        if: matrix.name == 'mips_24kc' || matrix.name == 'x86_64'
        run: sh bench/make-r2.sh "$PWD/sdk"

      - name: Collect release 2
        if: matrix.name == 'mips_24kc' || matrix.name == 'x86_64'
        env:
          ARCH: ${{ matrix.name }}
        run: |
          mkdir -p out-r2
          find sdk/bin/packages -name 'meshkeeper-*-r2.apk' |
          while read -r f; do
            cp "$f" "out-r2/$(basename "$f" .apk)-$ARCH.apk"
          done
          ls -l out-r2

      - uses: actions/upload-artifact@v7
        if: matrix.name == 'mips_24kc' || matrix.name == 'x86_64'
        with:
          name: bench-r2-${{ matrix.name }}
          path: out-r2/*.apk
          if-no-files-found: error

  # The real apks on OpenWrt in QEMU (bench/): malta (mips_24kc, the C6's package) for install,
  # jail, pairing with a fake satellite and the upgrade restart; x86-64 for sysupgrade, which
  # malta has no image for. x86 uses KVM when the runner has it.
  bench:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: malta, arch: mips_24kc, env: qemu-malta-be.yaml, fetch: fetch.sh}
          - {name: x86-64, arch: x86_64, env: qemu-x86-64.yaml, fetch: fetch-x86.sh}
    steps:
      - uses: actions/checkout@v7

      # The LuCI apk is architecture independent and ships only in the x86_64 artifact.
      - uses: actions/download-artifact@v8
        with:
          name: meshkeeper-${{ matrix.arch }}
          path: apks
      - uses: actions/download-artifact@v8
        with:
          name: bench-r2-${{ matrix.arch }}
          path: apks
      - uses: actions/download-artifact@v8
        if: matrix.arch != 'x86_64'
        with:
          name: meshkeeper-x86_64
          path: apks-luci
      - run: ls -l apks apks-luci 2>/dev/null || ls -l apks

      - uses: actions/cache@v6
        with:
          path: bench/.cache
          key: bench-images-${{ matrix.name }}-${{ hashFiles('bench/fetch.sh', 'bench/fetch-x86.sh') }}

      - name: Let the container use KVM
        if: matrix.name == 'x86-64'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            echo "KVM_FLAG=--device /dev/kvm" >> "$GITHUB_ENV"
          else
            echo "no /dev/kvm on this runner: x86 runs under TCG"
          fi

      - run: docker build -t meshkeeper-bench -f bench/Containerfile bench

      - name: Run the bench
        env:
          ARCH: ${{ matrix.arch }}
          TARGET_ENV: ${{ matrix.env }}
          FETCH: ${{ matrix.fetch }}
        run: |
          luci_dir=apks; [ -d apks-luci ] && luci_dir=apks-luci
          # shellcheck disable=SC2086  # KVM_FLAG is "--device /dev/kvm" or empty
          docker run --rm ${KVM_FLAG:-} \
            -e ARCH -e TARGET_ENV -e FETCH \
            -v "$PWD:/repo" -v "$PWD/apks:/apks:ro" -v "$PWD/$luci_dir:/luci:ro" \
            meshkeeper-bench sh -c '
              set -eu
              sh "./$FETCH"
              uv sync --frozen -q
              exec uv run pytest --lg-env "targets/$TARGET_ENV" tests -v --tb=short \
                --meshkeeper-apk "$(ls /apks/meshkeeper-*-r1-$ARCH.apk)" \
                --meshkeeper-apk-r2 "$(ls /apks/meshkeeper-*-r2-$ARCH.apk)" \
                --luci-apk "$(ls /luci/luci-app-meshkeeper-*.apk)"
            '

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: meshkeeper-*  # not bench-r2-*, the upgrade-test builds
          merge-multiple: true

      # A tag that disagrees with build.zig.zon would publish a package whose
      # version nobody can find again.
      - name: Tag matches build.zig.zon
        run: |
          v=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          [ "v$v" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match version $v in build.zig.zon"
            exit 1
          }

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
